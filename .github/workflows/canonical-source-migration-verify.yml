name: Canonical Source Consumer Migration Verify

on:
  push:
    branches:
      - refactor/canonical-source-consumer-migration-01
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://pypirvzclxookrutpkrx.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_EldjgW5kPQt-NJM_5MoXSw_AgH7HrI9
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify legacy consumer references
        shell: bash
        run: |
          set -euo pipefail
          echo '--- Legacy consumer scan (app/lib/components/scripts only) ---'
          patterns=(
            'targetJpPerRombel'
            'target_jp_per_rombel'
            'kelas\.tahun_ajaran'
            'school_profile\.tahun_pelajaran_default'
            'school_profile\.semester_default'
          )
          failed=0
          for pattern in "${patterns[@]}"; do
            echo "Searching: $pattern"
            if grep -RInE --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.git --exclude='*.lock' "$pattern" app lib components scripts 2>/dev/null; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo 'Legacy active consumer references remain.'
            exit 1
          fi
          echo 'No scanned legacy consumer references remain.'

      - name: Type check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
