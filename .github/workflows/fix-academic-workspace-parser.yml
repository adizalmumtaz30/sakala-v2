name: Fix Academic Workspace Parser

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove malformed JSX comment
        shell: python
        run: |
          from pathlib import Path
          path = Path('app/(shell)/akademik/AkademikWorkspace.tsx')
          text = path.read_text(encoding='utf-8')
          malformed = '          {\n'
          marker = '          {/* Bagian 8.2 / 77 — Active Academic Context */}\n'
          if marker not in text:
              raise SystemExit('Expected malformed JSX comment marker not found')
          text = text.replace(marker, '', 1)
          path.write_text(text, encoding='utf-8')
      - name: Commit source fix and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'app/(shell)/akademik/AkademikWorkspace.tsx'
          git rm .github/workflows/fix-academic-workspace-parser.yml
          git commit -m 'fix: stabilize AkademikWorkspace JSX parsing'
          git push origin main
