name: B04 wire Jam Pelajaran

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire B-04 workspace
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/(shell)/akademik/AkademikWorkspace.tsx')
          s = p.read_text()
          import_line = 'import JamPelajaranManager from "./JamPelajaranManager";'
          if import_line not in s:
              marker = 'import { Card, Badge, EmptyState } from "@/components/ui/primitives";'
              if marker not in s:
                  raise SystemExit('B04 marker import not found')
              s = s.replace(marker, marker + '\n' + import_line, 1)
          old = '      {tab === "jam" && ('
          new = '      {tab === "jam" && <JamPelajaranManager activeContext={activeContext} initialJamList={jamList} />}\n\n      {false && tab === "jam" && ('
          if old not in s:
              raise SystemExit('B04 Jam tab marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git rm .github/workflows/b04-wire-jam.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'app/(shell)/akademik/AkademikWorkspace.tsx'
          git commit -m 'feat: wire Jam Pelajaran B-04 workspace'
          git push
