name: B-03 One-Time Comment Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-once:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair malformed JSX comments
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/(shell)/akademik/AkademikWorkspace.tsx')
          s = p.read_text()
          replacements = {
              '{/* Bagian 8.1 / 78 — School Profile */': '{/* Bagian 8.1 / 78 — School Profile */}',
              '{/* Bagian 8.2 / 77 — Active Academic Context */': '{/* Bagian 8.2 / 77 — Active Academic Context */}',
          }
          changed = 0
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new, 1)
                  changed += 1
          if changed == 0:
              raise SystemExit('No malformed B-03 JSX comment found; refusing mutation')
          p.write_text(s)
          PY
      - name: Remove one-time workflow and commit
        run: |
          git config user.name 'adizalmumtaz30'
          git config user.email 'adizalmumtaz30@gmail.com'
          rm -f .github/workflows/b03-comment-fix-once.yml
          git add 'app/(shell)/akademik/AkademikWorkspace.tsx' .github/workflows/b03-comment-fix-once.yml
          git commit -m 'fix: repair B-03 JSX comment syntax'
          git push
