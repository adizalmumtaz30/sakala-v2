name: Verify Academic Launcher Build

on:
  push:
    branches:
      - fix/academic-launcher-build

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Remove stale JSX section comment if present
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/(shell)/akademik/AkademikWorkspace.tsx')
          s = p.read_text(encoding='utf-8')
          marker = '          {/* Bagian 8.2 / 77 — Active Academic Context */}\n'
          if marker in s:
              s = s.replace(marker, '', 1)
              p.write_text(s, encoding='utf-8')
      - name: Install
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit verified source and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'app/(shell)/akademik/AkademikWorkspace.tsx'
          git rm .github/workflows/verify-academic-launcher-build.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix: stabilize academic launcher JSX build'
          git push origin HEAD
