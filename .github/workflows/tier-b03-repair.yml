name: TIER-B03 Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tier-b03-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Repair B-03 malformed JSX comments
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/(shell)/akademik/AkademikWorkspace.tsx')
          s = p.read_text(encoding='utf-8')
          original = s

          # These markers were emitted without the final JSX expression brace.
          s, n1 = re.subn(
              r'\{\s*/\*\s*Bagian 8\.1\s*/\s*78\s*[—-]\s*School Profile\s*\*/\s*(?!\})',
              '{/* Bagian 8.1 / 78 — School Profile */}',
              s,
              count=1,
          )

          # Remove the non-functional section marker entirely; it is not UI content.
          s, n2 = re.subn(
              r'\{\s*/\*\s*Bagian 8\.2\s*/\s*77\s*[—-]\s*Active Academic Context\s*\*/\s*\}',
              '',
              s,
              count=1,
          )

          if n1 != 1:
              raise SystemExit(f'B-03 malformed 8.1 comment not repaired: matches={n1}')
          if n2 != 1:
              raise SystemExit(f'B-03 8.2 marker not found: matches={n2}')
          if s == original:
              raise SystemExit('B-03 repair produced no source change')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate build
        run: npm ci && npm run build
      - name: Commit repaired B-03
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'app/(shell)/akademik/AkademikWorkspace.tsx'
          git diff --cached --quiet && exit 0
          git commit -m 'fix: repair B-03 malformed JSX comment'
          git push

# B-03 parser repair trigger v4
