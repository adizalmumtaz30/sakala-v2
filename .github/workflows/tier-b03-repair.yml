name: TIER-B03 Verify

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tier-b03-repair.yml'
      - 'app/(shell)/akademik/AkademikWorkspace.tsx'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify B-03 source markers are valid
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/(shell)/akademik/AkademikWorkspace.tsx')
          s = p.read_text(encoding='utf-8')
          forbidden = [
              '{/* Bagian 8.1 / 78 — School Profile */}}',
              '{/* Bagian 8.2 / 77 — Active Academic Context */}}',
          ]
          for marker in forbidden:
              if marker in s:
                  raise SystemExit(f'Invalid JSX marker found: {marker}')
          print('B-03 JSX marker verification PASS')
          PY
      - name: Production build verification
        run: npm ci && npm run build
