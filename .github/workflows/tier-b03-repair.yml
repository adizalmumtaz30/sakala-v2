name: TIER-B03 Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tier-b03-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Remove parser-triggering JSX comment safely
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/(shell)/akademik/AkademikWorkspace.tsx')
          s = p.read_text(encoding='utf-8')
          pattern = r'\{\s*/\*\s*Bagian 8\.2\s*/\s*77\s*[—-]\s*Active Academic Context\s*\*/\s*\}\s*'
          repaired, count = re.subn(pattern, '', s, count=1)
          if count != 1:
              raise SystemExit('B-03 parser-triggering JSX comment not found')
          p.write_text(repaired, encoding='utf-8')
          PY
      - name: Validate build
        run: npm ci && npm run build
      - name: Commit repaired B-03
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'app/(shell)/akademik/AkademikWorkspace.tsx'
          git diff --cached --quiet && exit 0
          git commit -m 'fix: repair B-03 JSX parser blocker'
          git push

# B-03 parser repair trigger
