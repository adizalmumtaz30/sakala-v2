name: TIER-B03 Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tier-b03-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Remove parser-triggering section comment
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/(shell)/akademik/AkademikWorkspace.tsx')
          s = p.read_text()
          target = '          {/* Bagian 8.2 / 77 — Active Academic Context */}\n'
          if target not in s:
              raise SystemExit('Expected B-03 source marker not found')
          p.write_text(s.replace(target, '', 1))
          PY
      - name: Validate build
        run: npm ci && npm run build
      - name: Commit repaired B-03
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'app/(shell)/akademik/AkademikWorkspace.tsx'
          git diff --cached --quiet && exit 0
          git commit -m 'fix: stabilize TIER-B03 Akademik workspace parser'
          git push

# B-03 parser repair trigger
