name: TIER-B03 Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tier-b03-repair.yml'
      - 'app/(shell)/akademik/AkademikWorkspace.tsx'

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Repair B-03 JSX markers in source
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/(shell)/akademik/AkademikWorkspace.tsx')
          s = p.read_text(encoding='utf-8')
          original = s
          lines = s.splitlines(keepends=True)
          lines = [
              line for line in lines
              if 'Bagian 8.1 / 78' not in line and 'Bagian 8.2 / 77' not in line
          ]
          s = ''.join(lines)
          if s == original:
              raise SystemExit('B-03 source cleanup found no target marker')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate build
        run: npm ci && npm run build
      - name: Commit repaired source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'app/(shell)/akademik/AkademikWorkspace.tsx'
          git diff --cached --quiet && exit 0
          git commit -m 'fix: remove malformed B-03 JSX markers from source'
          git push

# B-03 source cleanup trigger v5
