name: Verify Academic Structural Fix

on:
  push:
    branches:
      - fix/academic-workspace-structural-jsx-v2

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Merge academic profile/context cards
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/(shell)/akademik/AkademikWorkspace.tsx')
          s = p.read_text(encoding='utf-8')
          old = '          </Card>\n\n          <Card className="p-0">\n            <div className="flex items-center justify-between gap-3 px-5 pt-4 pb-2.5">'
          new = '          <div className="border-t border-border pt-4">\n            <div className="flex items-center justify-between gap-3 px-5 pb-2.5">'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one profile/context boundary, found {s.count(old)}')
          s = s.replace(old, new, 1)
          # Close the new context section before the outer Card closes.
          marker = '          </Card>\n        </div>\n      )}\n\n      {tab === "periode"'
          replacement = '          </div>\n          </Card>\n        </div>\n      )}\n\n      {tab === "periode"'
          if s.count(marker) != 1:
              raise SystemExit(f'Expected exactly one context-card close boundary, found {s.count(marker)}')
          s = s.replace(marker, replacement, 1)
          p.write_text(s, encoding='utf-8')
      - name: Install dependencies
        run: npm install
      - name: Production build
        run: npm run build
      - name: Commit only after build passes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'app/(shell)/akademik/AkademikWorkspace.tsx' '.github/workflows/verify-academic-structural-fix.yml'
          git rm '.github/workflows/verify-academic-structural-fix.yml'
          git commit -m 'fix: stabilize AkademikWorkspace JSX structure'
          git push origin HEAD
