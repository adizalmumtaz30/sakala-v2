name: B04 fix obsolete Jam Pelajaran block

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove obsolete Jam Pelajaran block
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/(shell)/akademik/AkademikWorkspace.tsx')
          s = p.read_text()
          start = s.find('      {false && tab === "jam" && (')
          if start == -1:
              raise SystemExit('obsolete block start not found')
          marker = '\n      {tab === "model" && ('
          end = s.find(marker, start)
          if end == -1:
              raise SystemExit('obsolete block end not found')
          s = s[:start] + s[end+1:]
          p.write_text(s)
          PY
          rm -f .github/workflows/b04-fix-build.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'app/(shell)/akademik/AkademikWorkspace.tsx' .github/workflows/b04-fix-build.yml
          git commit -m 'fix: remove obsolete jam pelajaran implementation'
          git push