name: Repair Akademik And Verify

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore known-good AkademikWorkspace
        shell: bash
        run: |
          git checkout fcc9a31267fbefad0ddbb173aa71ed03178231b9 -- 'app/(shell)/akademik/AkademikWorkspace.tsx'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Production build gate
        run: npm run build

      - name: Commit verified repair and remove gate
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'app/(shell)/akademik/AkademikWorkspace.tsx'
          git rm --ignore-unmatch '.github/workflows/repair-akademik-and-verify.yml'
          if git diff --cached --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git commit -m 'fix: restore known-good AkademikWorkspace JSX'
          git push origin HEAD:main
